services:
  # ── Web Service (Laravel App — Docker) ──────────────────────────────────────
  - type: web
    name: geprek-rejo
    runtime: docker          # ← Render build dari Dockerfile otomatis
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Ayam Geprek Rejo"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true    # Render otomatis generate APP_KEY
      - key: APP_URL
        value: https://geprek-rejo.onrender.com   # Ganti setelah deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── Database: MySQL dari Aiven.io ──────────────────────────────────────
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql-geprek-latifanika-7a32.g.aivencloud.com
      - key: DB_PORT
        value: "10921"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false            # ← Isi manual di Render Dashboard (jangan tulis di sini!)

      # SSL wajib untuk Aiven MySQL
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

# Tidak perlu blok "databases:" karena pakai Aiven eksternal

